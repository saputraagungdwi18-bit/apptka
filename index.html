<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Simulasi TKA Sekolah</title>
  <meta name="description" content="Aplikasi simulasi Tes Kemampuan Akademik (TKA) untuk sekolah.">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Simulasi TKA">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Percepat sambungan ke Google Apps Script -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Ikon baru ditampilkan setelah font ikon benar-benar termuat (mencegah teks ikon "bocor" saat offline/lambat).
    (function () {
      var d = document.documentElement;
      if (!document.fonts || !document.fonts.load) { d.classList.add('fi'); return; }
      document.fonts.load('24px "Material Symbols Outlined"', 'home').then(function (f) { if (f && f.length) d.classList.add('fi'); }).catch(function () {});
    })();
  </script>
  <style>
    #splash{position:fixed;inset:0;z-index:1000;background:#1e3a5f;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
    #splash.out{opacity:0;visibility:hidden}
    .sp-wrap{text-align:center;color:#fff}
    .sp-ring{position:relative;width:168px;height:168px;margin:0 auto}
    .sp-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
    .sp-track{fill:none;stroke:rgba(255,255,255,.14);stroke-width:2.5}
    .sp-arc{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:70 220;transform-origin:50% 50%;animation:sp-spin 1.4s cubic-bezier(.5,.1,.5,.9) infinite}
    .sp-logo{position:absolute;left:50%;top:50%;width:84px;height:84px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translate(-50%,-50%) scale(.85);animation:sp-in .7s .1s cubic-bezier(.2,.8,.2,1) forwards}
    .sp-title{margin:28px 0 6px;font:700 22px/28px Inter,system-ui,-apple-system,sans-serif;letter-spacing:.04em;opacity:0;animation:sp-up .6s .35s ease forwards}
    .sp-sub{margin:0;font:400 14px/20px Inter,system-ui,-apple-system,sans-serif;color:rgba(255,255,255,.75);opacity:0;animation:sp-up .6s .5s ease forwards}
    .sp-dots i{font-style:normal;animation:sp-blink 1.2s infinite both}
    .sp-dots i:nth-child(2){animation-delay:.2s}.sp-dots i:nth-child(3){animation-delay:.4s}
    @keyframes sp-spin{to{transform:rotate(360deg)}}
    @keyframes sp-in{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    @keyframes sp-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes sp-blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.sp-arc,.sp-dots i{animation:none}.sp-logo,.sp-title,.sp-sub{animation:none;opacity:1;transform:translate(-50%,-50%)}.sp-title,.sp-sub{transform:none}}
  </style>
  <script>setTimeout(function(){var s=document.getElementById("splash");if(s)s.classList.add("out");},8000);</script>
</head>
<body>
  <div id="splash" aria-hidden="true"><div class="sp-wrap"><div class="sp-ring"><svg viewBox="0 0 100 100"><circle class="sp-track" cx="50" cy="50" r="46"/><circle class="sp-arc" cx="50" cy="50" r="46"/></svg><img class="sp-logo" src="icons/icon-192.png" alt=""></div><h1 class="sp-title">Simulasi TKA</h1><p class="sp-sub">Memuat aplikasi<span class="sp-dots"><i>.</i><i>.</i><i>.</i></span></p></div></div>
  <div id="app"></div>
  <script>
    // Splash hanya untuk halaman masuk. Jika sesi masih berlaku, splash dilewati (refresh terasa seperti biasa).
    (function () {
      try {
        var raw = localStorage.getItem('tka:auth') || sessionStorage.getItem('tka:auth');
        var a = raw ? JSON.parse(raw) : null, exp = 0;
        if (a && a.token) {
          var b = a.token.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
          while (b.length % 4) b += '=';
          exp = JSON.parse(atob(b)).x || 0;
        }
        if (exp > Date.now() + 60000) { var s = document.getElementById('splash'); if (s) s.remove(); }
      } catch (e) {}
    })();
  </script>
  <noscript><p style="padding:24px">Aplikasi ini memerlukan JavaScript.</p></noscript>
  <script>
    // Nonaktifkan pinch-to-zoom dan zoom ganda-ketuk (iOS Safari mengabaikan meta viewport, jadi dicegah juga di sini).
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false }); });
    document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    var lastT = 0; document.addEventListener('touchend', function (e) { var n = Date.now(); if (n - lastT < 300) e.preventDefault(); lastT = n; }, { passive: false });
  </script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/siswa.js"></script>
  <script src="js/guru.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
